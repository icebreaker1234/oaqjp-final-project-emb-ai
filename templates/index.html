<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detector | Final project</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <p class="eyebrow">WATSON NLP · FINAL PROJECT</p>
    <h1>Emotion Detector</h1>
    <p class="intro">Enter a sentence and see the emotions Watson detects in it.</p>
    <form id="emotion-form">
      <label for="text-input">Your text</label>
      <textarea id="text-input" name="textToAnalyze" rows="4" placeholder="I think I am having fun" required></textarea>
      <button type="submit">Analyze emotion</button>
    </form>
    <section id="result" class="result" aria-live="polite" hidden>
      <h2>Analysis</h2>
      <p id="message"></p>
      <ul id="scores"></ul>
    </section>
    <p class="footnote">Powered by IBM Watson NLP EmotionPredict.</p>
  </main>
  <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
